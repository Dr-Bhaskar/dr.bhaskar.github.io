<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bhaskar's personal website">
  <title>Bhaskar | Personal Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 600px; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin-bottom: 12px; }
    p { color: #cbd5e1; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 8px;
      background: #38bdf8;
      color: #082f49;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm Bhaskar 👋</h1>
    <p>Welcome to my website. I'm building something great here.</p>
    <a href="mailto:hello@example.com">Contact Me</a>
  </main>
</body>
</html>
